<!-- @dsCard group="Colors" viewport="700x196" name="Warm Neutrals" subtitle="Paper surfaces + warm ink for text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-raised); font-family: var(--font-sans); color: var(--text-body); }
  .grp { font-size: 11px; text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--text-faint); font-weight: 600; margin: 0 0 8px; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; }
  .sw { flex: 1; }
  .chip { height: 46px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--border-hairline); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); margin-top: 7px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 1px; }
</style>
</head>
<body>
  <p class="grp">Paper — surfaces</p>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--paper-50)"></div><div class="name">50 · raised</div><div class="hex">#FFFDFA</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-100)"></div><div class="name">100 · canvas</div><div class="hex">#FAF6EF</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-200)"></div><div class="name">200 · sunken</div><div class="hex">#F4EEE3</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-300)"></div><div class="name">300 · inset</div><div class="hex">#ECE4D5</div></div>
    <div class="sw"><div class="chip" style="background:var(--paper-400)"></div><div class="name">400</div><div class="hex">#E1D7C4</div></div>
  </div>
  <p class="grp">Ink — text</p>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--ink-900)"></div><div class="name">900 · strong</div><div class="hex">#2A2620</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-700)"></div><div class="name">700 · body</div><div class="hex">#4A443B</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-500)"></div><div class="name">500 · muted</div><div class="hex">#6E665A</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-400)"></div><div class="name">400 · faint</div><div class="hex">#938A7B</div></div>
    <div class="sw"><div class="chip" style="background:var(--ink-300)"></div><div class="name">300 · disabled</div><div class="hex">#B6AD9C</div></div>
  </div>
</body>
</html>
