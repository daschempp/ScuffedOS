<!-- @dsCard group="Brand" viewport="700x210" name="Doodle Accents" subtitle="Hand-drawn marks for emphasis & warmth" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-raised); font-family: var(--font-display); color: var(--text-strong); }
  .row { display:flex; align-items:center; gap: 30px; flex-wrap: wrap; }
  .item { display:flex; flex-direction:column; align-items:center; gap: 10px; }
  .img-wrap { height: 46px; display:flex; align-items:center; justify-content:center; }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .ulwrap { position: relative; font-size: 22px; font-weight: 700; padding-bottom: 6px; }
  .ulwrap img { position:absolute; left:0; bottom:-4px; width: 100%; height: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/underline.svg" alt="" style="width:90px"></div><span class="lab">underline</span></div>
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/squiggle.svg" alt="" style="width:88px"></div><span class="lab">squiggle</span></div>
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/scuff.svg" alt="" style="width:72px"></div><span class="lab">scuff</span></div>
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/circle.svg" alt="" style="width:70px"></div><span class="lab">circle</span></div>
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/bracket.svg" alt="" style="height:44px"></div><span class="lab">bracket</span></div>
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/arrow.svg" alt="" style="width:54px"></div><span class="lab">arrow</span></div>
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/check.svg" alt="" style="width:46px"></div><span class="lab">check</span></div>
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/star.svg" alt="" style="width:56px"></div><span class="lab">star</span></div>
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/burst.svg" alt="" style="width:36px"></div><span class="lab">burst</span></div>
    <div class="item"><div class="img-wrap"><img src="../assets/doodles/sparkle.svg" alt="" style="width:30px"></div><span class="lab">sparkle</span></div>
  </div>
</body>
</html>
