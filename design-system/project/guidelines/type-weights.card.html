<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-raised); font-family: var(--font-sans); color: var(--text-strong); display:flex; gap: 40px; align-items:center; }
  .eyebrow { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-caps); font-weight: 600; color: var(--accent-text); }
  .weights span { font-size: var(--text-xl); margin-right: 16px; }
  .w4 { font-weight: 400; } .w5 { font-weight: 500; } .w6 { font-weight: 600; } .w7 { font-weight: 700; } .w8 { font-weight: 800; }
  .lab { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 10px; }
</style>
</head>
<body>
  <div>
    <p class="eyebrow">This week · Nutrition</p>
    <p class="lab" style="margin-top:14px">12 · caps · 0.09em tracking</p>
  </div>
  <div>
    <div class="weights"><span class="w4">Aa</span><span class="w5">Aa</span><span class="w6">Aa</span><span class="w7">Aa</span><span class="w8">Aa</span></div>
    <p class="lab">400 · 500 · 600 · 700 · 800</p>
  </div>
</body>
</html>
