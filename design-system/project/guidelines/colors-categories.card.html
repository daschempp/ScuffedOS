<!-- @dsCard group="Colors" viewport="700x150" name="Category Hues" subtitle="Warm accents for finance & nutrition categories" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-raised); font-family: var(--font-sans); color: var(--text-body); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; text-align: center; }
  .chip { height: 52px; border-radius: var(--radius-md); box-shadow: var(--shadow-xs); display:flex; align-items:center; justify-content:center; }
  .tag { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-pill); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); margin-top: 8px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 1px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--green-100)"><span class="tag" style="background:var(--green-600);color:#fff">Income</span></div><div class="name">Green</div><div class="hex">#3A6B4E</div></div>
    <div class="sw"><div class="chip" style="background:var(--clay-100)"><span class="tag" style="background:var(--clay-600);color:#fff">Spend</span></div><div class="name">Clay</div><div class="hex">#BC5A3C</div></div>
    <div class="sw"><div class="chip" style="background:var(--honey-100)"><span class="tag" style="background:var(--honey-600);color:#fff">Goals</span></div><div class="name">Honey</div><div class="hex">#C0892F</div></div>
    <div class="sw"><div class="chip" style="background:var(--sky-100)"><span class="tag" style="background:var(--sky-600);color:#fff">Sleep</span></div><div class="name">Sky</div><div class="hex">#3E708F</div></div>
    <div class="sw"><div class="chip" style="background:var(--plum-100)"><span class="tag" style="background:var(--plum-600);color:#fff">Notes</span></div><div class="name">Plum</div><div class="hex">#7E5A86</div></div>
  </div>
</body>
</html>
