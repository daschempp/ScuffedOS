<!-- @dsCard group="Brand" viewport="700x190" name="Logo & Wordmark" subtitle="Sprout mark + Scuffed OS lockup" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--surface-raised); font-family: var(--font-display); display:flex; }
  .half { flex: 1; display:flex; align-items:center; justify-content:center; gap: 14px; padding: 28px; }
  .dark { background: var(--green-800); }
  .lockup { display:flex; align-items:center; gap: 13px; }
  .mark { width: 46px; height: 46px; }
  .word { font-weight: 800; font-size: 26px; letter-spacing: var(--tracking-tight); color: var(--text-strong); }
  .os { font-weight: 500; color: var(--accent-text); }
  .word-dark { color: #F3F8F3; }
  .os-dark { color: var(--green-300); }
  .sub { display:block; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.04em; color: var(--text-faint); font-weight: 400; margin-top: 2px; }
</style>
</head>
<body>
  <div class="half">
    <div class="lockup">
      <img class="mark" src="../assets/logo-mark.svg" alt="Scuffed OS">
      <div><span class="word">Scuffed <span class="os">OS</span></span></div>
    </div>
  </div>
  <div class="half dark">
    <div class="lockup">
      <img class="mark" src="../assets/logo-mark.svg" alt="Scuffed OS">
      <div><span class="word word-dark">Scuffed <span class="os-dark">OS</span></span></div>
    </div>
  </div>
</body>
</html>
