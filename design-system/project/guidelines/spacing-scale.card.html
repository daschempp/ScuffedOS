<!-- @dsCard group="Spacing" viewport="700x168" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-raised); font-family: var(--font-sans); color: var(--text-body); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .col { text-align: center; }
  .bar { background: var(--accent-soft); border-radius: var(--radius-xs); box-shadow: inset 0 0 0 1px var(--accent-border); }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); margin-top: 8px; font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="width:4px;height:4px"></div><div class="tok">1</div><div class="px">4</div></div>
    <div class="col"><div class="bar" style="width:8px;height:8px"></div><div class="tok">2</div><div class="px">8</div></div>
    <div class="col"><div class="bar" style="width:12px;height:12px"></div><div class="tok">3</div><div class="px">12</div></div>
    <div class="col"><div class="bar" style="width:16px;height:16px"></div><div class="tok">4</div><div class="px">16</div></div>
    <div class="col"><div class="bar" style="width:24px;height:24px"></div><div class="tok">6</div><div class="px">24</div></div>
    <div class="col"><div class="bar" style="width:32px;height:32px"></div><div class="tok">8</div><div class="px">32</div></div>
    <div class="col"><div class="bar" style="width:48px;height:48px"></div><div class="tok">12</div><div class="px">48</div></div>
    <div class="col"><div class="bar" style="width:64px;height:64px"></div><div class="tok">16</div><div class="px">64</div></div>
    <div class="col"><div class="bar" style="width:80px;height:80px"></div><div class="tok">20</div><div class="px">80</div></div>
  </div>
</body>
</html>
