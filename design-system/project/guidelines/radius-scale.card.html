<!-- @dsCard group="Spacing" viewport="700x172" name="Corner Radius" subtitle="Soft & rounded — 12px default card" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-raised); font-family: var(--font-sans); color: var(--text-body); }
  .row { display: flex; gap: 16px; align-items:flex-end; }
  .col { text-align: center; }
  .box { width: 72px; height: 56px; background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent-border); }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-strong); margin-top: 8px; font-weight: 600; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="tok">xs</div><div class="px">6</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="tok">sm</div><div class="px">9</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><div class="tok">md</div><div class="px">11</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-lg); background:var(--green-600); box-shadow:none"></div><div class="tok" style="color:var(--accent-text)">lg ·card</div><div class="px">12</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="tok">xl</div><div class="px">18</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="tok">2xl</div><div class="px">24</div></div>
    <div class="col"><div class="box" style="border-radius:var(--radius-pill)"></div><div class="tok">pill</div><div class="px">999</div></div>
  </div>
</body>
</html>
