<!-- @dsCard group="Colors" viewport="700x172" name="Brand — Forest Green" subtitle="Primary accent scale, 600 is the default" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-raised); font-family: var(--font-sans); color: var(--text-body); }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-md); box-shadow: var(--shadow-xs); }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); margin-top: 8px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .star { position: absolute; }
  .key { display:flex; align-items:center; gap:6px; }
  .dot { width:6px; height:6px; border-radius:999px; background: var(--accent); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--green-800)"></div><div class="name">800</div><div class="hex">#284E39</div></div>
    <div class="sw"><div class="chip" style="background:var(--green-700)"></div><div class="name">700 · hover</div><div class="hex">#2D5640</div></div>
    <div class="sw"><div class="chip" style="background:var(--green-600); box-shadow: var(--shadow-accent)"></div><div class="name" style="color:var(--accent-text)">600 · primary</div><div class="hex">#3A6B4E</div></div>
    <div class="sw"><div class="chip" style="background:var(--green-500)"></div><div class="name">500</div><div class="hex">#4F8463</div></div>
    <div class="sw"><div class="chip" style="background:var(--green-400)"></div><div class="name">400</div><div class="hex">#6B9E7E</div></div>
    <div class="sw"><div class="chip" style="background:var(--green-200)"></div><div class="name">200</div><div class="hex">#C4DAC9</div></div>
    <div class="sw"><div class="chip" style="background:var(--green-100); box-shadow: inset 0 0 0 1px var(--border-hairline)"></div><div class="name">100 · soft</div><div class="hex">#DEEBE1</div></div>
    <div class="sw"><div class="chip" style="background:var(--green-50); box-shadow: inset 0 0 0 1px var(--border-hairline)"></div><div class="name">50 · tint</div><div class="hex">#EDF4EE</div></div>
  </div>
</body>
</html>
