<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Semantic colors with soft tints" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px 22px; background: var(--surface-raised); font-family: var(--font-sans); color: var(--text-body); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; }
  .pair { display: flex; height: 52px; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-xs); }
  .solid { width: 56%; }
  .soft { flex: 1; }
  .name { font-size: 12px; font-weight: 600; color: var(--text-strong); margin-top: 8px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 1px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="pair"><div class="solid" style="background:var(--success)"></div><div class="soft" style="background:var(--success-soft)"></div></div><div class="name">Success</div><div class="hex">#3A6B4E · #DEEBE1</div></div>
    <div class="sw"><div class="pair"><div class="solid" style="background:var(--warning)"></div><div class="soft" style="background:var(--warning-soft)"></div></div><div class="name">Warning</div><div class="hex">#C0892F · #F6E9CF</div></div>
    <div class="sw"><div class="pair"><div class="solid" style="background:var(--danger)"></div><div class="soft" style="background:var(--danger-soft)"></div></div><div class="name">Danger</div><div class="hex">#BC5A3C · #F6E0D7</div></div>
    <div class="sw"><div class="pair"><div class="solid" style="background:var(--info)"></div><div class="soft" style="background:var(--info-soft)"></div></div><div class="name">Info</div><div class="hex">#3E708F · #DCE8EF</div></div>
  </div>
</body>
</html>
