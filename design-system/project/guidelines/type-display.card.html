<!-- @dsCard group="Type" viewport="700x220" name="Display — Schibsted Grotesk" subtitle="Headings & page titles, tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-raised); font-family: var(--font-display); color: var(--text-strong); }
  .line { display: flex; align-items: baseline; gap: 14px; margin-bottom: 12px; }
  .spec { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); width: 110px; flex: none; }
  .d1 { font-size: var(--text-4xl); font-weight: 800; letter-spacing: var(--tracking-tight); line-height: 1; }
  .d2 { font-size: var(--text-2xl); font-weight: 700; letter-spacing: var(--tracking-snug); }
  .d3 { font-size: var(--text-xl); font-weight: 600; letter-spacing: var(--tracking-snug); }
</style>
</head>
<body>
  <div class="line"><span class="spec">48 · 800</span><span class="d1">Good morning, Sam</span></div>
  <div class="line"><span class="spec">30 · 700</span><span class="d2">Here's your day at a glance</span></div>
  <div class="line"><span class="spec">24 · 600</span><span class="d3">Today's agenda &amp; memory</span></div>
</body>
</html>
